<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/logo.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./styles/index.css" />
    <title>Snitap Patins</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,700;1,700&family=Syne:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="top">
      <a href="#">
        <img src="./assets/logo.svg" />
      </a>

      <a href="#">
        <img src="./assets/icons/shopping-bag-01.svg" />
        <span>1</span>
      </a>
    </header>

    <section class="hero">
      <div>
        <h1>
          Snitap, sua vida mais
          <div>
            <span>radical</span>
            <span>divertida</span>
            <span>saudável</span>
            <span>radical</span>
          </div>

        <div class="buttons">
          <a href="#" class="button buy shadow">
            <img src="./assets/icons/shopping-bag-01.svg" alt="" />

          </a>
          <a href="#" class="button play">
            <span class="shadow">
              <img src="./assets/icons/play.svg" alt="" />
            </span>
            Veja em ação
          </a>
        </div>
      </div>

      <div>
        <div class="content">
          <img src="./assets//hero/ellipse.svg" alt="" />
          <img src="./assets/hero/patins-image.png" alt="" />
          <img src="./assets/hero/stars-1.svg" alt="" />
          <img src="./assets/hero/stars-2.svg" alt="" />
        </div>
      </div>
    </section>

    <section class="banner">
      <div class="scroller bg-gradient-animate">
        <div class="rolling">
          <img src="./assets/banner.svg" />

          <img src="./assets/banner.svg" />

          <img src="./assets/banner.svg" />
          <img src="./assets/banner.svg" />
          <img src="./assets/banner.svg" />

      </div>

    <section class="gallery">
      <header>
        <span>Galeria de fotos</span>
        <h2>#usesnitap por aí</h2>
      </header>

      <div class="content">
        <figure>
          <img src="./assets/images/1.png" alt="" />
          <figcaption>
            <img src="./assets/images/person.png" alt="" />
            <span>@laviniapereira</span>
          </figcaption>
        </figure>

        <figure data-delay>
          <img src="./assets/images/2.png" alt="" />
          <figcaption>
            <img src="./assets/images/person.png" alt="" />
            <span>@laviniapereira</span>

        </figure>

            <span>@laviniapereira</span>
          </figcaption>
        </figure>

        <figure data-delay>
          <img src="./assets/images/4.png" alt="" />
          <figcaption>
            <img src="./assets/images/person.png" alt="" />
            <span>@laviniapereira</span>
          </figcaption>
        </figure>
